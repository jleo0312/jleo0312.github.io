# Portfolio editor update: 2026-09-25 — visual page builder
media:
  input: media
  output: /media
content:
- name: portfolio
  label: Edit portfolio
  type: file
  path: content.json
  format: json
  fields:
  - name: visualEditorLink
    label: Visual page editor
    type: string
    default: https://jleo0312.github.io/editor/
    readonly: true
    description: Open this address for live preview, Add Section, move, duplicate and visual photo controls. The
      fields below remain available.
  - name: siteIcon
    label: Website icon — upload your browser-tab image
    type: image
    options:
      extensions:
      - png
      - ico
      - svg
      - jpg
      - jpeg
      - webp
    description: Upload a square PNG, SVG or ICO to replace the globe/default icon beside the website title in
      your browser tab. Save here, then open your website in a fresh tab to see it.
    default: ''
  - name: website
    label: All website text
    type: object
    description: Edit the text shown throughout your website here, including the gallery introduction, footer,
      headings, navigation and buttons. Leave a text field blank to hide that text. Your About Me writing, hobbies
      and individual projects are below.
    fields:
    - name: gallery
      label: Gallery page text
      type: object
      fields:
      - name: eyebrow
        label: Small heading — THE PROJECT GALLERY
        type: string
        default: THE PROJECT GALLERY
      - name: headline
        label: Main heading — Ideas. Made real.
        type: text
        default: Ideas. Made real.
      - name: subtitle
        label: Description beneath the heading
        type: text
        default: A collection of builds, experiments, and work in progress.
      - name: allProjects
        label: Project list label — All projects
        type: string
        default: All projects
      - name: showCount
        label: Show project count
        type: boolean
        default: true
    - name: footer
      label: Footer — bottom of every page
      type: object
      fields:
      - name: left
        label: Left footer text — Josh · Mechanical Engineering
        type: text
        default: Josh · Mechanical Engineering
        description: Change this text, or clear it to hide this side of the footer.
      - name: right
        label: Right footer text — Washington State University · Pullman, WA
        type: text
        default: Washington State University · Pullman, WA
        description: Change this text, or clear it to hide this side of the footer.
    - name: home
      label: Homepage headings and buttons
      type: object
      fields:
      - name: eyebrow
        label: Small line above the headline
        type: string
        default: MECHANICAL ENGINEERING · WASHINGTON STATE UNIVERSITY
      - name: headline
        label: Main headline — first line
        type: text
        default: Hi, I’m Josh.
      - name: subheadline
        label: Main headline — second line
        type: text
        default: I like to build things.
      - name: button
        label: Main button text
        type: string
        default: Explore my projects ↗
      - name: buttonLink
        label: Main button destination
        type: string
        description: Use /?view=gallery for your gallery, or paste a full web address.
        default: /?view=gallery
      - name: aboutTitle
        label: About Me section heading
        type: string
        default: A little about me.
      - name: hobbiesTitle
        label: Hobbies section heading
        type: string
        default: Hobbies
      - name: highlightsTitle
        label: Homepage highlights heading
        type: string
        default: Things I’ve been working on.
      - name: galleryLink
        label: View gallery link text
        type: string
        default: View gallery ↗
    - name: identity
      label: Website name and browser-tab titles
      type: object
      fields:
      - name: brand
        label: Name in the top left
        type: string
        default: Josh.
      - name: homeTitle
        label: Homepage browser tab title
        type: string
        default: Josh — Mechanical Engineering
      - name: galleryTitle
        label: Gallery browser tab title
        type: string
        default: Projects — Josh
      - name: description
        label: Search description
        type: text
        default: Josh’s mechanical engineering portfolio. Automotive builds, fabrication, and composites projects
          at Washington State University.
    - name: navigation
      label: Navigation links
      type: object
      fields:
      - name: about
        label: About page link
        type: string
        default: About me
      - name: gallery
        label: Gallery link
        type: string
        default: Gallery
      - name: skip
        label: Skip-to-content link
        type: string
        default: Skip to content
    - name: project
      label: Project page links and card labels
      type: object
      fields:
      - name: back
        label: Back link above a project
        type: string
        default: ← All projects
      - name: endText
        label: Text at the bottom of a project
        type: string
        default: Keep exploring.
      - name: galleryButton
        label: Bottom gallery button text
        type: string
        default: Back to the gallery ↗
      - name: coverLabel
        label: Small label on text-only thumbnails
        type: string
        default: PROJECT
      - name: coverMark
        label: Corner symbol on text-only thumbnails
        type: string
        default: ↗
      - name: showNumbers
        label: Show project numbers
        type: boolean
        default: true
      - name: videoFallback
        label: Video error text
        type: string
        default: Your browser cannot play this video.
      - name: downloadVideo
        label: Video download link text
        type: string
        default: Download the video
      - name: previewPlay
        label: Thumbnail play button text
        type: string
        default: Play preview
      - name: previewPause
        label: Thumbnail pause button text
        type: string
        default: Pause preview
    - name: carousel
      label: Homepage slideshow labels and settings
      type: object
      fields:
      - name: source
        label: What the slideshow displays
        type: select
        options:
          values:
          - name: selected
            label: My selected gallery projects
          - name: demo
            label: Nine blank demonstration cards
        description: Choose your projects below under Projects → Feature on homepage. Turn it on for up to nine
          projects and set their Homepage highlight order.
        default: selected
      - name: seconds
        label: Seconds between slide changes
        type: number
        options:
          min: 1
          max: 30
        description: 2.5 means the slideshow advances every 2.5 seconds.
        default: 2.5
      - name: pause
        label: Pause button text
        type: string
        default: Pause
      - name: play
        label: Play button text
        type: string
        default: Play
      - name: previous
        label: Previous button text or symbol
        type: string
        default: ←
      - name: next
        label: Next button text or symbol
        type: string
        default: →
      - name: showCount
        label: Show slide count
        type: boolean
        default: true
    - name: messages
      label: Other page messages
      type: object
      fields:
      - name: notFound
        label: Missing page heading
        type: text
        default: Nothing here yet.
      - name: backToProjects
        label: Missing page button
        type: string
        default: Back to projects ↗
      - name: loadError
        label: Loading error heading
        type: text
        default: Couldn’t load the portfolio.
      - name: retry
        label: Loading error instructions
        type: text
        default: Please refresh to try again.
  - name: name
    label: Your name
    type: string
    required: true
  - name: heroPhoto
    label: Homepage photo
    type: image
  - name: heroImage
    label: Homepage photo controls
    component: imageControls
  - name: heroPhotoAlt
    label: Homepage photo description
    type: string
  - name: portrait
    label: About-me photo
    type: image
  - name: portraitImage
    label: About-me photo controls
    component: captionedImageLayout
  - name: personal
    label: Photo caption
    type: text
    description: 'This text appears directly below your About-me photo. It used to be called About me: second
      paragraph. On desktop, the photo adjusts so the caption ends level with the main About Me text.'
  - name: portraitAlt
    label: About-me photo description
    type: string
  - name: bio
    label: About me — main text
    type: text
    description: The main text beside your photo. Write as many paragraphs as you like; leave a blank line between
      them. Use Photo caption for text underneath the photo.
  - name: hobbiesIntro
    label: Text under Hobbies
    type: text
    default: ''
    description: Appears below the Hobbies heading and above the three photos.
  - name: hobbies
    label: Hobby photos and text
    type: object
    list:
      min: 3
      max: 3
      collapsible:
        collapsed: true
        summary: Hobby {index}
    description: The three portrait photo cards below About Me. Rename the section above under All website text
      → Homepage headings and buttons.
    fields:
    - name: photo
      label: Hobby photo
      type: image
    - name: title
      label: Optional title
      type: string
    - name: text
      label: Short paragraph
      type: text
    - name: alt
      label: Image description (accessibility)
      type: string
    - name: imageStyle
      label: Photo controls and caption
      component: imageControls
  - name: projects
    label: Projects
    type: object
    list:
      collapsible:
        collapsed: true
        summary: '{title}'
    description: Open a project to control where it appears. Keep Show in gallery on for visible projects. Choose
      up to nine with Feature on homepage, then set their highlight order.
    fields:
    - name: title
      label: Project title
      type: string
      required: true
    - name: showInGallery
      label: Show in gallery
      type: boolean
      default: true
      description: Turn on to include this project in the gallery. Turning it off also removes it from homepage
        highlights; its direct project link still works.
    - name: featuredOnHomepage
      label: Feature on homepage
      type: boolean
      default: true
      description: Turn on for projects you want in the homepage highlights. Choose up to nine. Show in gallery
        must also be on. Turn off for gallery-only projects.
    - name: homepageOrder
      label: Homepage highlight order
      type: select
      default: auto
      description: Choose up to nine highlighted projects. Desktop shows three at a time; mobile shows one at
        a time.
      options:
        values:
        - name: auto
          label: Use gallery order
        - name: '1'
          label: '1'
        - name: '2'
          label: '2'
        - name: '3'
          label: '3'
        - name: '4'
          label: '4'
        - name: '5'
          label: '5'
        - name: '6'
          label: '6'
        - name: '7'
          label: '7'
        - name: '8'
          label: '8'
        - name: '9'
          label: '9'
    - name: slug
      label: Project address
      type: string
      required: true
      pattern: ^[a-z0-9-]+$
      description: Choose a unique short name, such as engine-swap. Use lowercase letters, numbers and dashes.
    - name: thumbnail
      label: Gallery thumbnail
      type: image
    - name: thumbnailAlt
      label: Thumbnail image description
      type: string
    - name: description
      label: Brief project description
      type: text
      description: One short paragraph below the project title.
    - name: video
      label: Main video (MP4)
      type: file
    - name: previewVideo
      label: Animated thumbnail video (MP4)
      type: file
    - name: thumbnailMotion
      label: Thumbnail animation
      type: select
      options:
        values:
        - label: Loop automatically
          name: loop
        - label: Play on hover
          name: hover
        - label: Still picture
          name: still
    - name: thumbnailFit
      label: Thumbnail picture fit
      type: select
      options:
        values:
        - label: Fill the thumbnail
          name: cover
        - label: Show the whole picture
          name: contain
    - name: photos
      label: Photo + text sections
      type: object
      list:
        collapsible:
          collapsed: true
          summary: Photo {index}
      fields:
      - name: src
        label: Photo
        type: image
        required: true
      - name: title
        label: Optional heading
        type: string
      - name: text
        label: Text beside the photo
        type: text
      - name: alt
        label: Image description (accessibility)
        type: string
      - name: id
        label: Photo ID
        type: string
        hidden: true
      - name: shortCaption
        label: Short caption under photo
        type: text
      - name: showCaption
        label: Show caption
        type: boolean
        default: true
      - name: imageStyle
        label: Photo controls
        component: imageLayout
      description: Add an item, upload its photo, and type the paragraph beside it. Reorder the items to change
        their order on the page.
    - name: coverText
      label: Cover text if no thumbnail
      type: text
    - name: theme
      label: Cover color
      type: select
      options:
        values:
        - dark
        - silver
        - blue
    - name: thumbnailStyle
      label: Thumbnail controls and caption
      component: imageControls
    - name: videoStyle
      label: Main video size and caption
      component: imageControls
    - name: useSections
      label: Use custom section layout
      type: boolean
      default: false
      description: The visual editor manages this switch. Turn on to allow an intentionally empty page; turn off
        with an empty section list to restore the original layout.
    - name: sections
      label: Sections — add / move / duplicate / delete
      component: sections
  - name: pageLayouts
    label: Homepage, About and Gallery sections
    type: object
    fields:
    - name: home
      label: Homepage
      type: object
      fields:
      - name: useSections
        label: Use custom section layout
        type: boolean
        default: false
        description: The visual editor manages this switch. Turn on to allow an intentionally empty page; turn
          off with an empty section list to restore the original layout.
      - name: sections
        label: Sections — add / move / duplicate / delete
        component: sections
    - name: about
      label: About page
      type: object
      fields:
      - name: useSections
        label: Use custom section layout
        type: boolean
        default: false
        description: The visual editor manages this switch. Turn on to allow an intentionally empty page; turn
          off with an empty section list to restore the original layout.
      - name: sections
        label: Sections — add / move / duplicate / delete
        component: sections
    - name: gallery
      label: Gallery
      type: object
      fields:
      - name: useSections
        label: Use custom section layout
        type: boolean
        default: false
        description: The visual editor manages this switch. Turn on to allow an intentionally empty page; turn
          off with an empty section list to restore the original layout.
      - name: sections
        label: Sections — add / move / duplicate / delete
        component: sections
  - name: pages
    label: Extra pages
    type: object
    list:
      collapsible:
        collapsed: true
        summary: '{title}'
    fields:
    - name: title
      label: Page title
      type: string
    - name: slug
      label: Page address
      type: string
      pattern: ^[a-z0-9]+(-[a-z0-9]+)*$
    - name: showInNavigation
      label: Show in navigation
      type: boolean
      default: false
    - name: useSections
      label: Use custom section layout
      type: boolean
      default: false
      description: The visual editor manages this switch. Turn on to allow an intentionally empty page; turn off
        with an empty section list to restore the original layout.
    - name: sections
      label: Sections — add / move / duplicate / delete
      component: sections
  - name: visualEditorVersion
    label: Visual editor version
    type: number
    hidden: true
settings:
  content:
    merge: true
components:
  imageLayout:
    type: object
    fields:
    - &id001
      name: enabled
      label: Use custom image controls
      type: boolean
      default: false
    - &id002
      name: size
      label: Image size
      type: select
      options:
        values:
        - name: small
          label: Small
        - name: medium
          label: Medium
        - name: large
          label: Large
        - name: full
          label: Full width
    - &id003
      name: width
      label: Image width (%)
      type: number
      options:
        min: 10
        max: 100
    - &id004
      name: height
      label: Image height (0 = automatic)
      type: number
      options:
        min: 0
        max: 1200
    - &id005
      name: aspect
      label: Aspect ratio
      type: select
      options:
        values:
        - name: auto
          label: Original proportions
        - name: square
          label: Square
        - name: portrait
          label: Portrait 4:5
        - name: tall
          label: Portrait 3:4
        - name: landscape
          label: Landscape 4:3
        - name: wide
          label: Wide 16:9
    - &id006
      name: align
      label: Image alignment
      type: select
      options:
        values:
        - name: left
          label: Left
        - name: center
          label: Center
        - name: right
          label: Right
    - &id007
      name: position
      label: Placement beside nearby text
      type: select
      options:
        values:
        - name: left
          label: Photo left / text right
        - name: right
          label: Photo right / text left
        - name: above
          label: Photo above text
        - name: below
          label: Photo below text
    - &id008
      name: fit
      label: Photo crop / fit
      type: select
      options:
        values:
        - name: contain
          label: Show whole photo
        - name: cover
          label: Fill and crop
    - &id009
      name: focalX
      label: 'Crop focus: horizontal'
      type: number
      options:
        min: 0
        max: 100
    - &id010
      name: focalY
      label: 'Crop focus: vertical'
      type: number
      options:
        min: 0
        max: 100
    - &id011
      name: margin
      label: Space around photo
      type: number
      options:
        min: 0
        max: 120
    - &id012
      name: padding
      label: Padding inside photo frame
      type: number
      options:
        min: 0
        max: 80
    - &id013
      name: captionPosition
      label: Caption position
      type: select
      options:
        values:
        - name: below
          label: Below photo
        - name: above
          label: Above photo
    - &id014
      name: captionAlignment
      label: Caption alignment
      type: select
      options:
        values:
        - name: left
          label: Left
        - name: center
          label: Center
        - name: right
          label: Right
  captionedImageLayout:
    type: object
    fields:
    - *id001
    - *id002
    - *id003
    - *id004
    - *id005
    - *id006
    - *id007
    - *id008
    - *id009
    - *id010
    - *id011
    - *id012
    - &id015
      name: showCaption
      label: Show caption
      type: boolean
      default: true
    - *id013
    - *id014
  imageControls:
    type: object
    fields:
    - *id001
    - *id002
    - *id003
    - *id004
    - *id005
    - *id006
    - *id007
    - *id008
    - *id009
    - *id010
    - *id011
    - *id012
    - name: caption
      label: Image caption
      type: text
    - *id015
    - *id013
    - *id014
    description: Turn on custom image controls to override the original sizing. The visual editor provides sliders
      and drag handles for these same settings.
  sections:
    type: object
    list:
      collapsible:
        collapsed: true
        summary: '{type} — {heading}'
    fields:
    - name: id
      label: Section ID
      type: string
      hidden: true
    - name: type
      label: Section type
      type: select
      options:
        values:
        - name: photoText
          label: Photo and text
        - name: text
          label: Text
        - name: heading
          label: Heading
        - name: video
          label: Video / GIF
        - name: spacer
          label: Spacer
        - name: hero
          label: Homepage introduction
        - name: about
          label: About me
        - name: hobbies
          label: Hobbies
        - name: highlights
          label: Project highlights
        - name: galleryIntro
          label: Gallery introduction
        - name: galleryGrid
          label: Gallery projects
        - name: projectIntro
          label: Project introduction
        - name: projectVideo
          label: Project video
        - name: projectPhoto
          label: Existing project photo
        - name: projectThumbnail
          label: Project cover photo
        - name: projectEnd
          label: Project footer
      default: photoText
    - name: visible
      label: Show this section
      type: boolean
      default: true
    - name: heading
      label: Heading
      type: string
    - name: headingLevel
      label: Heading size
      type: select
      options:
        values:
        - name: h1
          label: Large
        - name: h2
          label: Section heading
        - name: h3
          label: Small
    - name: image
      label: Photo
      type: image
    - name: alt
      label: Image description
      type: string
    - name: text
      label: Main text
      type: text
    - name: caption
      label: Short caption under photo
      type: text
    - name: showCaption
      label: Show caption
      type: boolean
      default: true
    - name: imagePosition
      label: Image position
      type: select
      options:
        values:
        - name: left
          label: Photo left / text right
        - name: right
          label: Photo right / text left
        - name: above
          label: Photo above text
        - name: below
          label: Photo below text
    - name: imageWidth
      label: Photo column size
      type: number
      options:
        min: 10
        max: 90
    - name: textWidth
      label: Text column size
      type: number
      options:
        min: 10
        max: 90
    - name: alignment
      label: Vertical alignment
      type: select
      options:
        values:
        - name: start
          label: Top
        - name: center
          label: Center
        - name: end
          label: Bottom
    - name: textAlign
      label: Text alignment
      type: select
      options:
        values:
        - name: left
          label: Left
        - name: center
          label: Center
        - name: right
          label: Right
    - name: textSize
      label: Text size
      type: select
      options:
        values:
        - name: small
          label: Small
        - name: normal
          label: Medium
        - name: large
          label: Large
    - name: contentWidth
      label: Content width
      type: select
      options:
        values:
        - name: default
          label: Default
        - name: narrow
          label: Narrow
        - name: wide
          label: Wide
        - name: full
          label: Full width
    - name: gap
      label: Gap between photo and text
      type: number
      options:
        min: 0
        max: 100
    - name: spacingTop
      label: Space above section
      type: number
      options:
        min: 0
        max: 200
    - name: spacingBottom
      label: Space below section
      type: number
      options:
        min: 0
        max: 200
    - name: imageStyle
      label: Photo controls
      component: imageLayout
    - name: video
      label: Video file
      type: file
    - name: poster
      label: Video poster
      type: image
    - name: loop
      label: Loop video
      type: boolean
    - name: muted
      label: Mute video
      type: boolean
    - name: height
      label: Spacer height
      type: number
      options:
        min: 0
        max: 200
    - name: sourceId
      label: Existing photo ID
      type: string
      hidden: true
    description: Add, reorder, duplicate or remove sections. For live preview and drag controls, use https://jleo0312.github.io/editor/.
      Leave this list empty to keep the original page layout, unless Use custom section layout is on.
