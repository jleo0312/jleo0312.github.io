media:
  input: media
  output: /media
content:
- name: portfolio
  label: Edit portfolio
  type: file
  path: content.json
  format: json
  fields:
  - name: name
    label: Your name
    type: string
    required: true
  - name: heroPhoto
    label: Homepage photo
    type: image
  - name: portrait
    label: About-me photo
    type: image
  - name: bio
    label: 'About me: first paragraph'
    type: text
  - name: personal
    label: 'About me: second paragraph'
    type: text
  - name: projects
    label: Projects
    type: object
    list:
      collapsible:
        collapsed: true
        summary: '{title}'
    description: Add or remove projects here. The first three appear on the homepage.
    fields:
    - name: title
      label: Project title
      type: string
      required: true
    - name: slug
      label: Project address
      type: string
      required: true
      pattern: ^[a-z0-9-]+$
      description: Choose a unique short name, such as engine-swap. Use lowercase
        letters, numbers and dashes.
    - name: thumbnail
      label: Gallery thumbnail
      type: image
    - name: summary
      label: Short introduction
      type: text
    - name: description
      label: Overview
      type: text
    - name: year
      label: Year or status
      type: string
    - name: video
      label: Main video (MP4)
      type: file
    - name: previewVideo
      label: Hover preview (short MP4)
      type: file
    - name: photos
      label: Project photos
      type: object
      list:
        collapsible:
          collapsed: true
          summary: '{caption}'
      fields:
      - name: src
        label: Photo
        type: image
        required: true
      - name: caption
        label: Caption
        type: text
      - name: alt
        label: Image description
        type: string
    - name: details
      label: Extra description sections
      type: object
      list:
        collapsible:
          collapsed: true
          summary: '{title}'
      fields:
      - name: title
        label: Section heading
        type: string
      - name: text
        label: Section text
        type: text
    - name: coverText
      label: Cover text if no thumbnail
      type: text
    - name: theme
      label: Cover color
      type: select
      options:
        values:
        - dark
        - silver
        - blue
    - name: category
      label: Project detail label
      type: string
