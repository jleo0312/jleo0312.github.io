media:
  input: media
  output: /media
content:
- name: portfolio
  label: Edit portfolio
  type: file
  path: content.json
  format: json
  fields:
  - name: name
    label: Your name
    type: string
    required: true
  - name: heroPhoto
    label: Homepage photo
    type: image
  - name: portrait
    label: About-me photo
    type: image
  - name: bio
    label: 'About me: first paragraph'
    type: text
  - name: personal
    label: 'About me: second paragraph'
    type: text
  - name: hobbies
    label: Hobbies
    type: object
    list:
      min: 3
      max: 3
      collapsible:
        collapsed: true
        summary: Hobby {index}
    description: Three photos with a short paragraph underneath each, below About
      me.
    fields:
    - name: photo
      label: Hobby photo
      type: image
    - name: title
      label: Optional title
      type: string
    - name: text
      label: Short paragraph
      type: text
    - name: alt
      label: Image description (accessibility)
      type: string
  - name: homepageGalleryDemo
    label: Show nine blank carousel demo entries
    type: boolean
    description: 'On: nine blank slots in groups of three. Off: show your real projects.
      Each group stays for three seconds before sliding.'
  - name: projects
    label: Projects
    type: object
    list:
      collapsible:
        collapsed: true
        summary: '{title}'
    description: Add, edit, remove and reorder projects. Each page has a brief description,
      then photo + text sections.
    fields:
    - name: title
      label: Project title
      type: string
      required: true
    - name: slug
      label: Project address
      type: string
      required: true
      pattern: ^[a-z0-9-]+$
      description: Choose a unique short name, such as engine-swap. Use lowercase
        letters, numbers and dashes.
    - name: thumbnail
      label: Gallery thumbnail
      type: image
    - name: description
      label: Brief project description
      type: text
      description: One short paragraph below the project title.
    - name: video
      label: Main video (MP4)
      type: file
    - name: previewVideo
      label: Animated thumbnail video (MP4)
      type: file
    - name: thumbnailMotion
      label: Thumbnail animation
      type: select
      options:
        values:
        - label: Loop automatically
          name: loop
        - label: Play on hover
          name: hover
        - label: Still picture
          name: still
    - name: thumbnailFit
      label: Thumbnail picture fit
      type: select
      options:
        values:
        - label: Fill the thumbnail
          name: cover
        - label: Show the whole picture
          name: contain
    - name: photos
      label: Photo + text sections
      type: object
      list:
        collapsible:
          collapsed: true
          summary: Photo {index}
      fields:
      - name: src
        label: Photo
        type: image
        required: true
      - name: title
        label: Optional heading
        type: string
      - name: text
        label: Text beside the photo
        type: text
      - name: alt
        label: Image description (accessibility)
        type: string
      description: Add an item, upload its photo, and type the paragraph beside it.
        Reorder the items to change their order on the page.
    - name: coverText
      label: Cover text if no thumbnail
      type: text
    - name: theme
      label: Cover color
      type: select
      options:
        values:
        - dark
        - silver
        - blue
