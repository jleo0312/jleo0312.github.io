name: Optimize furnace gallery preview

on:
  push:
    paths:
      - ".github/workflows/optimize-furnace-preview.yml"

permissions:
  contents: write

jobs:
  optimize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install ffmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      - name: Create optimized gallery preview
        run: |
          ffmpeg -y -i "media/furnace-1080p60-under25mb.mp4" \
            -an \
            -vf "fps=30,scale='if(gt(iw,ih),min(iw,1280),-2)':'if(gt(iw,ih),-2,min(ih,1280))'" \
            -c:v libx264 -preset slow -crf 22 -pix_fmt yuv420p \
            -movflags +faststart \
            "media/furnace-gallery-preview.mp4"

      - name: Update portfolio to use optimized preview
        run: |
          python - <<'PY'
          import json
          path = "content.json"
          with open(path, "r", encoding="utf-8") as f:
              data = json.load(f)
          for project in data.get("projects", []):
              if project.get("slug") == "waste-oil-powered-furnace":
                  project["previewVideo"] = "/media/furnace-gallery-preview.mp4"
                  project["thumbnailMotion"] = "loop"
                  break
          with open(path, "w", encoding="utf-8") as f:
              json.dump(data, f, indent=2, ensure_ascii=False)
              f.write("\n")
          PY

      - name: Commit optimized preview
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "media/furnace-gallery-preview.mp4" content.json
          git commit -m "Optimize furnace gallery preview"
          git push
